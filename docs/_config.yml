title: jsonata2js
description: A Node.js library that compiles JSONata expressions into plain JavaScript functions at runtime
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  # sitemap.xml for Search Console. Uses site.url (auto-set from site.github on GitHub Pages).
  - jekyll-sitemap
# `design/` holds the port's engineering records (the performance log, the
# copy-vs-port ledger, review notes). They are gitignored, so a CI build never
# sees them -- but a local `bundle exec jekyll serve` would otherwise copy them
# into the site, so they are excluded here too.
#
# Setting `exclude` REPLACES Jekyll's default list rather than adding to it, so the Bundler files
# have to be re-listed here or they would be published as part of the site.
exclude:
  - Gemfile
  - Gemfile.lock
  - design/
